name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install Python package
        run: python -m pip install -e './src/python[test]'
      - name: Configuration, launch lifecycle and HTTP tests
        run: |
          New-Item -ItemType Directory -Path .runtime -Force | Out-Null
          python -m pytest src/python/tests/test_configuration.py src/python/tests/test_launch.py src/python/tests/test_agent_service.py -q --basetemp=.runtime/ci-pytest
      - name: Monster graph and provenance checks without game assets
        run: python -m pytest -c src/python/pyproject.toml src/python/tests/test_monster_simulation.py -m 'not local_knowledge' -q --basetemp=.runtime/ci-monsters
      - name: Frontend tests
        run: node --test src/web/tests/*.test.mjs
      - name: C# command checks without game assemblies
        run: dotnet run --project src/csharp/tests/CommandTests -c Release
